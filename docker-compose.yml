# BuildBud — Self-Hosted Distribution
# Generated by setup.sh — edit with care
#
# Stack: buildbud + postgres + postgrest + falkordb + nats + caddy
# No external dependencies required.
#
# Usage: run ./setup.sh first to generate .env and init the database

services:
  # ============================================
  # Postgres — Primary database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: buildbud-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: buildbud
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildbud"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # ============================================
  # PostgREST — REST API over Postgres
  # (drop-in replacement for Supabase REST API)
  # ============================================
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: buildbud-postgrest
    environment:
      PGRST_DB_URI: "postgres://authenticator:${POSTGRES_PASSWORD}@postgres:5432/buildbud"
      PGRST_DB_SCHEMA: "public"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_JWT_SECRET: "${JWT_SECRET}"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # ============================================
  # supabase-rest — Supabase-compat proxy for PostgREST
  # Rewrites /rest/v1/* -> PostgREST root so the app's hardcoded Supabase
  # /rest/v1 paths resolve against the bare self-host PostgREST.
  # ============================================
  supabase-rest:
    image: caddy:2-alpine
    container_name: buildbud-supabase-rest
    configs:
      - source: supabase_rest_caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      postgrest:
        condition: service_started
    restart: always

  # ============================================
  # FalkorDB — Graph knowledge store
  # ============================================
  falkordb:
    image: falkordb/falkordb:latest
    container_name: buildbud-falkordb
    command: ["--save", "900", "1"]
    environment:
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD}"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${FALKORDB_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ============================================
  # NATS — Message bus with JetStream
  # ============================================
  nats:
    image: nats:2.10-alpine
    container_name: buildbud-nats
    command:
      - "-js"
      - "-m"
      - "8222"
      - "--store_dir"
      - "/data"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  # ============================================
  # graph-api — memory graph REST sidecar (:3457, FalkorDB read path)
  # Reuses the app image; serves the knowledge-graph/Insights UI read path.
  # ============================================
  graph-api:
    image: ${REGISTRY:-hub.cutclouds.com}/buildbud:${VERSION:-latest}
    # Optional sidecar (memory-graph read API for Insights).
    # CORRECTION 2026-08-03: scripts/graph_api.py IS in the release image (gap
    # G-j is stale). The real blocker is DATA: /app/graph is not shipped --
    # chunks.json and links.json are gitignored build artifacts -- and nothing
    # in a self-host install generates them. Starting `--profile graph` today
    # yields a service whose file-backed routes read nothing and whose
    # graph-backed routes query an empty FalkorDB.
    # Making this real needs the indexing pipeline (parse_and_chunk ->
    # trace_and_link -> import_to_graph -> graph_algorithms) to run on the
    # instance, as it now does on bb-app and bb-coder.
    profiles: ["graph"]
    container_name: buildbud-graph-api
    entrypoint: []
    command: ["python3", "/app/scripts/graph_api.py"]
    environment:
      FALKORDB_HOST: "falkordb"
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: "${FALKORDB_PASSWORD}"
      GRAPHITI_DATABASE: "buildbud_user"
      BB_GRAPH_API_TOKEN: "${BB_GRAPH_API_TOKEN:-}"
      PYTHONPATH: "/app/backend:/app/scripts"
    depends_on:
      falkordb:
        condition: service_healthy
    restart: always

  # ============================================
  # bb-verify — render-verifier sidecar (owns Playwright)
  # In-product render checks call this over the local network so the app image
  # stays browser-free. GET /verify?url=... -> {pass, renderedChars, failures}
  # ============================================
  bb-verify:
    image: ${REGISTRY:-hub.cutclouds.com}/bb-verify:${VERSION:-latest}
    container_name: buildbud-bb-verify
    # Optional sidecar (in-product verification). Image not yet in the license
    # registry — start explicitly with `--profile verify` once it is (gap G-f).
    profiles: ["verify"]
    environment:
      BB_VERIFY_SERVICE_TOKEN: "${BB_VERIFY_SERVICE_TOKEN:-}"
      # Memory graph read path (Insights / knowledge-graph UI)
      GRAPH_API_URL: "http://graph-api:3457"
      # Mastermind code analysis (code-graph-rag bundled in the image)
      CODE_GRAPH_RAG_ENABLED: "true"
      CODE_GRAPH_RAG_PATH: "/opt/code-graph-rag"
      BB_GRAPH_API_TOKEN: "${BB_GRAPH_API_TOKEN:-}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8472/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  # ============================================
  # BuildBud — Application
  # ============================================
  buildbud:
    image: ${REGISTRY:-hub.cutclouds.com}/buildbud:${VERSION:-latest}
    container_name: buildbud-app
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      BUILDBUD_ENV: "user"
      # Allowlisted origins — MUST include this instance's own origin, or the
      # server 500s its own static assets and the app renders blank.
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost,https://localhost}"
      ENABLE_AUTH: "true"
      BUILDBUD_API_TOKEN: "${BUILDBUD_API_TOKEN}"
      # Claude auth — BYO: bring your own token (claude setup-token) or API key.
      # At least one is required or agents cannot authenticate.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      # Codex provider (optional, BYO OpenAI key). Claude is the default agent;
      # set OPENAI_API_KEY to enable the bundled @openai/codex CLI as a provider.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Agent memory (graphiti). Embedder is local (fastembed) — no key needed.
      # The LLM path is OpenAI-compatible: by default it reuses your OPENAI_API_KEY
      # (the same key Codex uses) against OpenAI. Claude-only users can point
      # GRAPHITI_LLM_* at any OpenAI-compatible endpoint (OpenRouter, litellm, ...).
      # Opt-in: set GRAPHITI_ENABLED=true and provide a key.
      GRAPHITI_ENABLED: "${GRAPHITI_ENABLED:-false}"
      GRAPHITI_LLM_BASE_URL: "${GRAPHITI_LLM_BASE_URL:-https://api.openai.com/v1}"
      GRAPHITI_LLM_API_KEY: "${GRAPHITI_LLM_API_KEY:-${OPENAI_API_KEY:-}}"
      GRAPHITI_LLM_MODEL: "${GRAPHITI_LLM_MODEL:-gpt-4o-mini}"
      GRAPHITI_LLM_SMALL_MODEL: "${GRAPHITI_LLM_SMALL_MODEL:-gpt-4o-mini}"
      GRAPHITI_DATABASE: "buildbud_user"
      FALKORDB_HOST: "falkordb"
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: "${FALKORDB_PASSWORD}"
      # Database (PostgREST)
      SUPABASE_URL: "http://supabase-rest:8000"
      SUPABASE_SERVICE_KEY: "${SERVICE_ROLE_KEY}"
      SUPABASE_ANON_KEY: "${ANON_KEY}"
      SUPABASE_SCHEMA: "public"
      # Message bus
      NATS_URL: "nats://nats:4222"
      NATS_ENABLED: "true"
      # In-product render gate -> delegates to the bb-verify sidecar (browser-free app)
      BB_VERIFY_URL: "http://bb-verify:8472"
      BB_VERIFY_SERVICE_TOKEN: "${BB_VERIFY_SERVICE_TOKEN:-}"
      # Security
      CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY}"
      BB_SIGNING_KEY_PATH: "/secrets/dispatch-signing.pem"
      BB_SIGNING_PUBKEY_PATH: "/secrets/dispatch-signing.pub"
      # Cross-instance feedback loop (opt-in, outbound-only). Token comes via env
      # (setup.sh extracts reportToken from the license into .env) since the container
      # cannot read the host's root:root 0600 license.json.
      BB_FEEDBACK_ENABLED: "${BB_FEEDBACK_ENABLED:-0}"
      BB_FEEDBACK_URL: "${BB_FEEDBACK_URL:-https://feedback.cutclouds.com/feedback}"
      BB_UPDATE_URL: "${BB_UPDATE_URL:-https://feedback.cutclouds.com/updates/ea}"
      BB_UPDATE_CONTROL_DIR: "/app/.update-control"
      BB_REPORT_TOKEN: "${BB_REPORT_TOKEN:-}"
      BB_INSTANCE_ID: "${BB_INSTANCE_ID:-}"
      BB_HUB_PUBKEY_PATH: "/secrets/hub-signing.pub"
    volumes:
      - app_data:/app/data
      - ${BB_CONTROL_DIR:-/var/lib/buildbud/update-control}:/app/.update-control
      - app_home:/home/node
      - ./secrets/dispatch-signing.pem:/secrets/dispatch-signing.pem:ro
      - ./secrets/dispatch-signing.pub:/secrets/dispatch-signing.pub:ro
      - ./secrets/hub-signing.pub:/secrets/hub-signing.pub:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
      supabase-rest:
        condition: service_started
      falkordb:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: always

  # ============================================
  # Caddy — TLS termination and reverse proxy
  # ============================================
  caddy:
    image: caddy:2-alpine
    container_name: buildbud-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      BB_DOMAIN: "${BB_DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - buildbud
    restart: always

configs:
  # Inlined so the whole self-host fix lives in this file (synced to the
  # installer repo). Rewrites the app's hardcoded Supabase /rest/v1 prefix
  # to the bare self-host PostgREST root.
  supabase_rest_caddyfile:
    content: |
      :8000 {
      	handle_path /rest/v1/* {
      		reverse_proxy postgrest:3000
      	}
      	handle {
      		reverse_proxy postgrest:3000
      	}
      }

volumes:
  postgres_data:
  falkordb_data:
  nats_data:
  app_data:
  app_home:
  caddy_data:
  caddy_config:
